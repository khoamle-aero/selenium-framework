name: Selenium Automation CI Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Execute Automated Browser Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your framework repository code blocks
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 2. Initialize stable Java 21 environment profile
      - name: Set Up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Ensure target browsers and virtual display server elements are physically active
      - name: Setup Web Browsers and Virtual Display Server Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox xvfb

      # 4. Trigger execution safely wrapped within an active Xvfb display loop
      - name: Run Multi-Threaded Parallel Execution Suite via Maven Wrapper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./mvnw clean test -Dheadless=true

      # 5. Automatically uploads screenshot files as downloadable zip files if failures occur
      - name: Archive Test Failure UI Screenshots
        uses: actions/upload-artifact@v4
        if: failure() # Only runs if a previous step throws an error status
        with:
          name: selenium-failure-screenshots
          path: screenshots/
          retention-days: 7
